name: tests

# The full suite runs offline: no network, no API key, no model downloads.
# LLM calls are stubbed and heavy optional dependencies are skipped via
# pytest.importorskip, so CI stays under a minute and never flakes on a
# provider outage. A test suite that needs credentials does not get run.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Windows is in the matrix because of FM-020: eight weeks of green CI on
    # Ubuntu while three tests were broken on Windows, due to cp1252 being the
    # default text encoding there. Cross-platform bugs are invisible on a
    # single-platform matrix.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CI subset — no torch, no vector DB)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        run: pytest -q --tb=short

      - name: Verify no fabricated-observation guards were weakened
        # These guard the failure modes that produce PLAUSIBLE wrong values
        # rather than crashes -- the ones that reach a README and do not
        # reproduce. Named explicitly so a future refactor cannot delete them
        # without the diff being obvious.
        #
        # The scope-guard pair names both call paths on purpose: the original
        # fix covered extract_group only, leaving --no-group free to read a
        # Parent-Company-Only table as consolidated. One path passing is not
        # evidence the other does.
        #
        # shell: bash is REQUIRED, not stylistic. windows-latest defaults to
        # pwsh, where "\" is not a line continuation (backtick is). Under pwsh
        # `pytest -q \` passes a literal backslash to pytest, which collects
        # from the drive root and dies on D:/System Volume Information, and
        # every following line runs as its own command. This step was therefore
        # failing on BOTH Windows jobs -- the step whose entire purpose is to
        # stop these guards being weakened was itself inert on half the matrix.
        # Same lesson as FM-020, one layer up: the bug was in the harness, not
        # in any tested behaviour.
        shell: bash
        run: |
          pytest -q \
            tests/test_analysis.py::test_empty_current_year_gives_undefined_drift \
            tests/test_features.py::test_unparsed_current_year_is_dropped_not_scored_as_zero_drift \
            tests/test_models.py::test_no_signal_found_in_pure_noise \
            tests/test_models.py::test_permutation_p_value_can_never_be_zero \
            tests/test_extraction.py::test_prior_year_is_wrong_even_inside_tolerance \
            tests/test_extraction.py::test_scope_guard_applies_on_the_per_metric_path \
            tests/test_extraction.py::test_scope_guard_applies_on_the_grouped_path
